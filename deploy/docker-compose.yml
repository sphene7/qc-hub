services:
  mysql:
    image: mysql:8.0
    container_name: xxx-mgmt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-xxx_management}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: xxx-mgmt-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-qc_hub}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      APP_MODE: product
      SYSTEM_NAME: ${SYSTEM_NAME:-质控通管理系统}
      SYSTEM_SUBTITLE: ${SYSTEM_SUBTITLE:-产线巡检 · 客诉跟进 · 产品抽检}
      ALLOW_UPLOAD: "false"
      ALLOW_REGISTER: "false"
      ENABLE_AI: "false"
      PRODUCT_MODULES_FILE: /app/product.modules.json
    volumes:
      - ./data/bundle.json:/data/bundle.json:ro
      - ./product.modules.json:/app/product.modules.json:ro

volumes:
  mysql_data:
